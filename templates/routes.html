{% extends 'base.html' %}

{% block title %}Routes Planning{% endblock %}
{% block page_header %}Bus Routes & Traffic Controller{% endblock %}

{% block content %}
<div class="row">
    <!-- Loop through routes -->
    <div class="col-lg-4 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold"><i class="fa-solid fa-map text-primary me-1"></i> Route 1</h5>
                <span class="badge bg-primary" id="badge-traffic-route-1">Traffic: LOW</span>
            </div>
            <div class="card-body">
                <!-- Traffic selector for this route -->
                <div class="mb-3 p-3 bg-light rounded">
                    <label class="form-label font-weight-bold small"><i class="fa-solid fa-traffic-light"></i> Simulate Traffic Delay</label>
                    <select class="form-select form-select-sm" onchange="changeTraffic('Route 1', this.value)" id="select-traffic-route-1">
                        <option value="LOW">LOW (+0 min)</option>
                        <option value="MEDIUM">MEDIUM (+3 min)</option>
                        <option value="HIGH">HIGH (+7 min)</option>
                    </select>
                </div>
                <div id="route-1-stops-list">
                    <!-- Stops sequence populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold"><i class="fa-solid fa-map text-success me-1"></i> Route 2</h5>
                <span class="badge bg-success" id="badge-traffic-route-2">Traffic: LOW</span>
            </div>
            <div class="card-body">
                <!-- Traffic selector for this route -->
                <div class="mb-3 p-3 bg-light rounded">
                    <label class="form-label font-weight-bold small"><i class="fa-solid fa-traffic-light"></i> Simulate Traffic Delay</label>
                    <select class="form-select form-select-sm" onchange="changeTraffic('Route 2', this.value)" id="select-traffic-route-2">
                        <option value="LOW">LOW (+0 min)</option>
                        <option value="MEDIUM">MEDIUM (+3 min)</option>
                        <option value="HIGH">HIGH (+7 min)</option>
                    </select>
                </div>
                <div id="route-2-stops-list">
                    <!-- Stops sequence populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold"><i class="fa-solid fa-map text-info me-1"></i> Route 3</h5>
                <span class="badge bg-info" id="badge-traffic-route-3">Traffic: LOW</span>
            </div>
            <div class="card-body">
                <!-- Traffic selector for this route -->
                <div class="mb-3 p-3 bg-light rounded">
                    <label class="form-label font-weight-bold small"><i class="fa-solid fa-traffic-light"></i> Simulate Traffic Delay</label>
                    <select class="form-select form-select-sm" onchange="changeTraffic('Route 3', this.value)" id="select-traffic-route-3">
                        <option value="LOW">LOW (+0 min)</option>
                        <option value="MEDIUM">MEDIUM (+3 min)</option>
                        <option value="HIGH">HIGH (+7 min)</option>
                    </select>
                </div>
                <div id="route-3-stops-list">
                    <!-- Stops sequence populated dynamically -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('nav-routes').classList.add('active');

    function loadRoutes() {
        fetch('/api/routes')
            .then(res => res.json())
            .then(routes => {
                routes.forEach(route => {
                    const stopsContainer = document.getElementById(`route-${route.route_id.replace(' ', '-')}-stops-list`);
                    if (!stopsContainer) return;

                    let html = '<div class="position-relative ps-4 border-start border-2 border-primary-subtle ms-2">';
                    route.stops.forEach((stop, index) => {
                        const isSchool = stop.stop_name.toLowerCase().includes('school');
                        const icon = isSchool ? 'fa-school text-danger' : 'fa-location-dot text-primary';
                        html += `
                            <div class="mb-4 relative">
                                <span class="position-absolute translate-middle start-0 bg-white rounded-circle border border-primary p-1 d-flex align-items-center justify-content-center" style="width: 28px; height: 28px; left: -14px;">
                                    <i class="fa-solid ${icon}" style="font-size: 0.75rem;"></i>
                                </span>
                                <div class="ms-3">
                                    <h6 class="m-0 font-weight-bold text-dark">${stop.stop_name}</h6>
                                    <span class="text-muted small">Planned Arrival: <strong>${stop.planned_arrival_time}</strong></span>
                                    <br>
                                    <span class="text-muted small">GPS: ${stop.latitude.toFixed(4)}, ${stop.longitude.toFixed(4)}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    stopsContainer.innerHTML = html;
                });
            });
            
        // Get active traffic levels from history
        fetch('/api/history/all')
            .then(res => res.json())
            .then(history => {
                const trafficMap = {};
                history.forEach(h => {
                    if (!trafficMap[h.route_id]) {
                        trafficMap[h.route_id] = h.traffic_level;
                    }
                });
                
                // Set default traffic levels in UI dropdowns
                ['Route 1', 'Route 2', 'Route 3'].forEach(rId => {
                    const lvl = trafficMap[rId] || 'LOW';
                    const dropdown = document.getElementById(`select-traffic-${rId.replace(' ', '-')}`);
                    const badge = document.getElementById(`badge-traffic-${rId.replace(' ', '-')}`);
                    if (dropdown) dropdown.value = lvl;
                    if (badge) {
                        badge.innerText = `Traffic: ${lvl}`;
                        if (lvl === 'HIGH') {
                            badge.className = 'badge bg-danger';
                        } else if (lvl === 'MEDIUM') {
                            badge.className = 'badge bg-warning text-white';
                        } else {
                            badge.className = 'badge bg-success';
                        }
                    }
                });
            });
    }

    function changeTraffic(routeId, trafficLevel) {
        fetch('/api/traffic', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                route_id: routeId,
                traffic_level: trafficLevel
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadRoutes();
            } else {
                alert("Failed to update traffic condition.");
            }
        })
        .catch(err => {
            console.error("Error setting traffic:", err);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadRoutes();
    });
</script>
{% endblock %}
